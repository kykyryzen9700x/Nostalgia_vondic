{% extends "base.html" %}
{% block content %}
<div class="register-box" style="max-width: 900px;">
    <h2 style="text-align: center;">📋 Обращения в поддержку</h2>
    <table style="width:100%; border-collapse: collapse; margin-top:20px;">
        <tr style="background: #d82e2e; color: #ffcc00;">
            <th>ID</th><th>Email</th><th>Сообщение</th><th>Статус</th><th>Дата</th><th></th>
        </tr>
        {% for t in tickets %}
        <tr style="border-bottom: 1px solid #b45f2e;">
            <td>{{ t.id }}</td>
            <td>{{ t.email }}</td>
            <td>{{ t.message[:50] }}{% if t.message|length > 50 %}...{% endif %}</td>
            <td>{{ t.status }}</td>
            <td>{{ t.created_at[:16] }}</td>
            <td><a href="/admin/ticket/{{ t.id }}" class="pixel-button" style="padding:5px 10px;">Ответить</a></td>
        </tr>
        {% endfor %}
    </table>
    <div style="text-align:center; margin-top:20px;">
        <a href="/" class="pixel-button">На главную</a>
    </div>
</div>
{% endblock %}
