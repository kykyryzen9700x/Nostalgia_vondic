{% extends "base.html" %}

{% block content %}
<div class="register-box" style="max-width: 500px; margin: 50px auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">СОЗДАЙ НИК</h2>
    
    {% if error %}
        <div style="background: #d82e2e; color: white; padding: 10px; border-radius: 15px; margin-bottom: 20px; text-align: center;">
            {{ error }}
        </div>
    {% endif %}
    
    <form method="post">
        <div class="form-group">
            <label>ТВОЙ НИК:</label>
            <input type="text" name="nickname" class="pixel-input" placeholder="MARIO" required>
        </div>
        <button type="submit" class="pixel-button big-button">ПОДТВЕРДИТЬ</button>
    </form>
</div>
{% endblock %}
