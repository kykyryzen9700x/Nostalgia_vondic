{% extends "base.html" %} {% block content %}
<div class="register-box" style="max-width: 800px">
	<h2 style="text-align: center">📝 Обращение #{{ ticket.id }}</h2>
	<div class="form-group">
		<label>Chat ID (Vondic):</label>
		<div style="background: #fff; padding: 10px">
			{{ ticket.vondic_chat_id }}
		</div>
	</div>
	<div class="form-group">
		<label>Сообщение:</label>
		<div style="background: #fff; padding: 10px; white-space: pre-wrap">
			{{ ticket.message }}
		</div>
	</div>
	{% if ticket.admin_response %}
	<div class="form-group">
		<label>Ваш ответ:</label>
		<div style="background: #e0ffe0; padding: 10px">
			{{ ticket.admin_response }}
		</div>
	</div>
	{% endif %}
	<form
		id="replyForm"
		method="post"
		action="/admin/ticket/{{ ticket.id }}/reply"
	>
		<div class="form-group">
			<label>Ответ пользователю:</label
			><textarea name="reply" class="pixel-input" rows="5" required></textarea>
		</div>
		<button type="submit" class="pixel-button big-button">
			Отправить ответ
		</button>
	</form>
	<div style="margin-top: 20px">
		<a href="/admin/tickets" class="pixel-button">← Назад к списку</a>
	</div>
</div>
<script>
	document.getElementById('replyForm').onsubmit = async e => {
		e.preventDefault()
		const form = e.target
		const reply = form.reply.value
		const resp = await fetch(form.action, {
			method: 'POST',
			body: new URLSearchParams({ reply })
		})
		const data = await resp.json()
		if (data.success) alert('Ответ отправлен!')
		else alert('Ошибка: ' + data.error)
	}
</script>
{% endblock %}
